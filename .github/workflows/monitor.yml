name: radar-moradia
on:
  schedule:
    # 08:17, 13:17 e 19:17 no horário de Brasília (UTC-3)
    - cron: "17 11,16,22 * * *"
  workflow_dispatch:
    inputs:
      notificar:
        description: "Abrir Issue com novidades (true/false)"
        default: "true"
permissions:
  contents: write
  issues: write
concurrency:
  group: radar-moradia
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest -q
      - name: Coleta e relatório
        id: coleta
        run: python -m radar_moradia
      - name: Resumo na página da execução
        if: always()
        run: |
          if [ -f reports/relatorio.md ]; then cat reports/relatorio.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Salva banco, relatórios e logs no repositório
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -f data/radar.db reports/ logs/ || true
          if git diff --cached --quiet; then echo "Nada a salvar"; exit 0; fi
          git commit -m "Radar: coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
      - name: Notifica novidades (Issue)
        if: success() && (github.event_name == 'schedule' || inputs.notificar == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar_moradia.notify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio
          path: |
            reports/
            logs/
          retention-days: 30
