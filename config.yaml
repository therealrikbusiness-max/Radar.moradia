# RADAR MORADIA v1.0 — configuração
# Valores em reais (R$) por mês.

orcamento:
  prioridade_max: 900      # faixa de prioridade máxima
  teto: 1100               # teto, incluindo condomínio e taxas obrigatórias conhecidas
  # Acima do teto, só entra na seção "excepcionais" se a pontuação for alta
  # e o total não passar deste limite:
  excepcional_max: 1400
  excepcional_pontuacao_min: 70

# Municípios aceitos (comparação sem acento e sem caixa)
municipios: [paulinia, campinas]

# Bairros-alvo. "peso" entra na classificação (0–25).
# Em Campinas, só bairros listados aqui são aceitos (o município é grande demais).
regioes:
  - { nome: "Morumbi", municipio: paulinia, peso: 25, apelidos: ["jardim morumbi", "morumbi"] }
  - { nome: "Centro", municipio: paulinia, peso: 25, apelidos: ["centro"] }
  - { nome: "Vila Presidente Médici", municipio: paulinia, peso: 22, apelidos: ["presidente medici", "vila presidente medici"] }
  - { nome: "São José", municipio: paulinia, peso: 20, apelidos: ["sao jose", "jardim sao jose", "sao jose i", "sao jose ii", "sao jose iii"] }
  - { nome: "Betel", municipio: paulinia, peso: 20, apelidos: ["betel", "parque betel", "jardim betel"] }
  - { nome: "João Aranha", municipio: paulinia, peso: 20, apelidos: ["joao aranha", "joao aranha"] }
  - { nome: "Barão Geraldo", municipio: campinas, peso: 22, apelidos: ["barao geraldo", "cidade universitaria", "vila santa isabel", "vila santa izabel", "jardim santa genebra", "real parque", "guara", "jardim do sol"] }
  # Acesso pela Rod. Prof. Zeferino Vaz (SP-332) / Transportes Cavalinho
  - { nome: "Bom Retiro", municipio: paulinia, peso: 15, apelidos: ["bom retiro", "parque bom retiro"] }
  - { nome: "Nova Paulínia", municipio: paulinia, peso: 15, apelidos: ["nova paulinia"] }
  - { nome: "Santa Terezinha", municipio: paulinia, peso: 12, apelidos: ["santa terezinha", "santa teresinha"] }
  - { nome: "Monte Alegre", municipio: paulinia, peso: 12, apelidos: ["monte alegre", "jardim monte alegre"] }
  - { nome: "Santa Cecília", municipio: paulinia, peso: 10, apelidos: ["santa cecilia", "jardim santa cecilia"] }
  - { nome: "Alto de Pinheiros", municipio: paulinia, peso: 10, apelidos: ["alto de pinheiros"] }
  - { nome: "Cascata", municipio: paulinia, peso: 10, apelidos: ["cascata", "jardim cascata"] }

# Em Paulínia, bairro não listado é aceito com este peso (cidade pequena).
peso_bairro_nao_listado_paulinia: 5

# Coletas completas seguidas sem o anúncio antes de marcá-lo indisponível
# (a paginação do MCP oscila entre execuções; observado em 04/11/2026)
ausencias_para_indisponivel: 3

tipos_aceitos: [kitnet, studio, edicula, casa_fundos, casa_1_quarto, casa_pequena]

http:
  user_agent: "RadarMoradia/1.0 (+https://github.com/therealrikbusiness-max/Radar.moradia)"
  timeout: 30
  intervalo_min_segundos: 4     # pausa mínima entre requisições ao mesmo host
  tentativas: 3

# Fontes. Cada uma é um módulo em radar_moradia/sources/.
# Uma fonte só é consultada se estiver "ativa" E o robots.txt permitir a URL.
fontes:
  chavesnamao:
    ativa: true
    modulo: chavesnamao
    # Servidor MCP oficial do portal (canal indicado pelo próprio site para agentes).
    endpoint: "https://www.chavesnamao.com.br/api/mcp/"
    max_paginas_por_consulta: 20   # limite da própria ferramenta
    consultas:
      # Paulínia: todos os tipos até o limite de "excepcional"; a classificação filtra o resto
      - filters: { transaction: aluguel, city: "Paulínia", state: SP, maxPrice: 1400 }
      # Barão Geraldo e sub-bairros
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Barão Geraldo", maxPrice: 1400 }
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Cidade Universitária", maxPrice: 1400 }
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Vila Santa Isabel", maxPrice: 1400 }
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Jardim Santa Genebra", maxPrice: 1400 }
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Real Parque", maxPrice: 1400 }
      - filters: { transaction: aluguel, city: Campinas, state: SP, neighborhood: "Guará", maxPrice: 1400 }
      # Kitnets em toda Campinas (a região é filtrada localmente pelos apelidos em `regioes`)
      - filters: { transaction: aluguel, propertyType: kitnet, city: Campinas, state: SP, maxPrice: 1400 }

  # Exemplo de feed XML VRSync de imobiliária (ative somente com URL pública/autorizada):
  imobiliaria_exemplo:
    ativa: false
    modulo: vrsync
    nome: imobiliaria_exemplo
    urls: []
